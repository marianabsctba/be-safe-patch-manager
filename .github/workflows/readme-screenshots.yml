name: README screenshots
# Captures the current product UI for README documentation.

on:
  push:
    branches: [main]
    paths:
      - "server/app/static/**"
      - "scripts/capture-readme-screenshots.py"
      - "README.md"
      - ".github/workflows/readme-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-screenshots-main
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Refresh and commit screenshots from latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Screenshot publish attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            python scripts/capture-readme-screenshots.py

            if [ -z "$(git status --porcelain -- docs/screenshots)" ]; then
              echo "Screenshots already current."
              exit 0
            fi

            git add docs/screenshots
            git commit -m "docs: refresh real UI screenshots [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main advanced while screenshots were being generated; recapturing from latest HEAD."
          done

          echo "Could not publish refreshed screenshots after 3 attempts."
          exit 1
