name: README screenshots
# Captures the current product UI for README documentation.

on:
  push:
    branches: [main]
    paths:
      - "server/app/static/**"
      - "scripts/capture-readme-screenshots.py"
      - "README.md"
      - ".github/workflows/readme-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Capture current UI
        run: python scripts/capture-readme-screenshots.py

      - name: Commit refreshed screenshots
        run: |
          if [ -z "$(git status --porcelain -- docs/screenshots)" ]; then
            echo "Screenshots already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "docs: refresh real UI screenshots [skip ci]"
          git push origin HEAD:main
