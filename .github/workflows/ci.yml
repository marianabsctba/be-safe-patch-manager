name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: patchmgr
          POSTGRES_USER: patchmgr
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchmgr -d patchmgr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r server/requirements.txt
          pip install -r server/requirements-dev.txt

      - name: Python syntax
        run: python -m compileall -q server agent scripts

      - name: Alembic migration on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://patchmgr:ci-postgres-password@127.0.0.1:5432/patchmgr
        run: |
          cd server
          alembic upgrade head
          alembic current

      - name: Unit tests
        env:
          ADMIN_TOKEN: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          ENROLLMENT_TOKEN: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          GREENBONE_ENABLED: "false"
        run: |
          cd server
          pytest -q tests

      - name: Docker Compose validation
        env:
          ADMIN_TOKEN: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          ENROLLMENT_TOKEN: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          POSTGRES_PASSWORD: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
        run: docker compose config >/dev/null

      - name: Shell syntax
        run: |
          bash -n deploy/install-linux.sh
          sh -n server/entrypoint.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: node --check server/app/static/app.js

      - name: Pre-publish security check
        run: python scripts/pre-publish-check.py
