name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: patchmgr
          POSTGRES_USER: patchmgr
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchmgr -d patchmgr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r server/requirements.txt
          pip install -r server/requirements-dev.txt
          pip install -r agent/requirements.txt

      - name: Python syntax
        run: python -m compileall -q server agent scripts

      - name: Agent signed release drill
        run: |
          TMP_RELEASE="$(mktemp -d)"
          python scripts/agent-release.py generate-key \
            --private-key "$TMP_RELEASE/signing-private.pem" \
            --public-key "$TMP_RELEASE/signing-public.pem"
          python scripts/agent-release.py build \
            --private-key "$TMP_RELEASE/signing-private.pem" \
            --output "$TMP_RELEASE/release" \
            --version 0.16.0 \
            --source-commit "$GITHUB_SHA"
          python scripts/agent-release.py verify \
            --public-key "$TMP_RELEASE/signing-public.pem" \
            --release-dir "$TMP_RELEASE/release"
          rm -rf "$TMP_RELEASE"

      - name: Evidence Pack attestation drill
        run: |
          TMP_EVIDENCE="$(mktemp -d)"
          python scripts/evidence-attestation-key.py generate-key \
            --private-key "$TMP_EVIDENCE/evidence-private.pem" \
            --public-key "$TMP_EVIDENCE/evidence-public.pem"
          EVIDENCE_ATTESTATION_ENABLED=true \
          EVIDENCE_ATTESTATION_PRIVATE_KEY_FILE="$TMP_EVIDENCE/evidence-private.pem" \
          EVIDENCE_ATTESTATION_PUBLIC_KEY_FILE="$TMP_EVIDENCE/evidence-public.pem" \
          PYTHONPATH=server \
          TMP_EVIDENCE="$TMP_EVIDENCE" \
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from app.evidence_attestation import build_evidence_attestation

          def canonical(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))

          def digest(value):
              return hashlib.sha256(canonical(value).encode("utf-8")).hexdigest()

          section = {"probe": "ok"}
          section_hash = digest(section)
          content = {
              "schema": "be-safe-campaign-evidence-pack/v1",
              "generated_at": "2026-09-29T00:00:00+00:00",
              "campaign_id": "ci-campaign",
              "summary": {},
              "section_hashes": {"probe": section_hash},
              "sections": {"probe": section},
          }
          pack_hash = digest(content)
          attestation = build_evidence_attestation(
              pack_sha256=pack_hash,
              campaign_id="ci-campaign",
              generated_at=content["generated_at"],
          )
          pack = {
              **content,
              "manifest": {
                  "hash_algorithm": "SHA-256",
                  "pack_sha256": pack_hash,
                  "section_hashes": content["section_hashes"],
                  "attestation": attestation,
              },
          }
          Path(os.environ["TMP_EVIDENCE"], "pack.json").write_text(
              json.dumps(pack, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
          python scripts/verify-evidence-pack.py "$TMP_EVIDENCE/pack.json" \
            --public-key "$TMP_EVIDENCE/evidence-public.pem" \
            --campaign-id ci-campaign
          rm -rf "$TMP_EVIDENCE"


      - name: Alembic migration on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://patchmgr:ci-postgres-password@127.0.0.1:5432/patchmgr
        run: |
          cd server
          alembic upgrade head
          alembic current

      - name: PostgreSQL backup and restore drill
        run: |
          python - <<'PY'
          import psycopg
          conn = psycopg.connect(
              "host=127.0.0.1 port=5432 dbname=patchmgr user=patchmgr password=ci-postgres-password"
          )
          with conn:
              with conn.cursor() as cur:
                  cur.execute("CREATE TABLE IF NOT EXISTS backup_probe (id integer primary key, value text not null)")
                  cur.execute("INSERT INTO backup_probe (id, value) VALUES (1, 'ok') ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value")
          conn.close()
          PY

          docker run --rm --network host             -e PGPASSWORD=ci-postgres-password             -v "$PWD:/work"             postgres:17-alpine             pg_dump -h 127.0.0.1 -U patchmgr -d patchmgr               --format=custom --no-owner --no-privileges               -f /work/ci-patchmgr.dump

          python - <<'PY'
          import psycopg
          conn = psycopg.connect(
              "host=127.0.0.1 port=5432 dbname=postgres user=patchmgr password=ci-postgres-password",
              autocommit=True,
          )
          with conn.cursor() as cur:
              cur.execute("DROP DATABASE IF EXISTS patchmgr_restore")
              cur.execute("CREATE DATABASE patchmgr_restore")
          conn.close()
          PY

          docker run --rm --network host             -e PGPASSWORD=ci-postgres-password             -v "$PWD:/work"             postgres:17-alpine             pg_restore -h 127.0.0.1 -U patchmgr -d patchmgr_restore               --no-owner --no-privileges /work/ci-patchmgr.dump

          python - <<'PY'
          import psycopg
          conn = psycopg.connect(
              "host=127.0.0.1 port=5432 dbname=patchmgr_restore user=patchmgr password=ci-postgres-password"
          )
          with conn.cursor() as cur:
              cur.execute("SELECT value FROM backup_probe WHERE id = 1")
              value = cur.fetchone()[0]
          conn.close()
          assert value == "ok", value
          PY

          rm -f ci-patchmgr.dump


      - name: Unit tests
        env:
          ENROLLMENT_TOKEN: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          GREENBONE_ENABLED: "false"
        run: |
          cd server
          timeout 360s pytest -q tests

      - name: Docker Compose validation
        env:
          ENROLLMENT_TOKEN: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          POSTGRES_PASSWORD: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
        run: |
          docker compose config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null

      - name: Shell syntax
        run: |
          bash -n deploy/install-linux.sh
          bash -n scripts/backup-postgres.sh
          bash -n scripts/restore-postgres.sh
          sh -n server/entrypoint.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "deploy/windows/install-agent.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }


      - name: NGINX production config
        run: |
          mkdir -p deploy/nginx/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1             -subj "/CN=ci.local"             -keyout deploy/nginx/tls/server.key             -out deploy/nginx/tls/server.crt >/dev/null 2>&1
          cp deploy/nginx/tls/server.crt deploy/nginx/tls/agent-ca.crt
          docker run --rm --add-host patch-manager:127.0.0.1             -v "$PWD/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"             -v "$PWD/deploy/nginx/tls:/etc/nginx/tls:ro"             nginx:stable-alpine nginx -t
          rm -f deploy/nginx/tls/server.key deploy/nginx/tls/server.crt deploy/nginx/tls/agent-ca.crt

      - name: Prometheus rules and scrape config
        run: |
          docker run --rm \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:latest \
            check rules /etc/prometheus/patch-manager.rules.yml

          docker run --rm \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:latest \
            check config /etc/prometheus/scrape.example.yml

      - name: Grafana dashboard JSON
        run: python -m json.tool deploy/grafana/patch-manager-overview.json >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          node --check server/app/static/app.js
          node --check server/app/static/i18n.js

      - name: Pre-publish security check
        run: python scripts/pre-publish-check.py
