name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python -m compileall -q server agent scripts

      - name: Shell syntax
        run: bash -n deploy/install-linux.sh

      - name: Pre-publish security check
        run: python scripts/pre-publish-check.py
