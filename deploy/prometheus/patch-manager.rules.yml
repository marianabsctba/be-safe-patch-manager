groups:
  - name: be-safe-patch-manager
    rules:
      - alert: PatchManagerDown
        expr: up{job="be-safe-patch-manager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Be Safe Patch Manager indisponível
          description: O Prometheus não consegue coletar métricas do Patch Manager há pelo menos 2 minutos.

      - alert: PatchManagerDatabaseUnavailable
        expr: patch_manager_database_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Banco do Patch Manager indisponível
          description: A aplicação não consegue consultar o PostgreSQL.

      - alert: PatchManagerStalledJobs
        expr: patch_manager_jobs{status="stalled"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Há jobs stalled no Patch Manager
          description: Existe pelo menos uma execução que exige revisão administrativa antes de qualquer retry.

      - alert: PatchManagerBackupMissing
        expr: patch_manager_backup_status == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Nenhum backup recente registrado
          description: O exporter não encontrou estado de um backup PostgreSQL concluído com sucesso.

      - alert: PatchManagerBackupStale
        expr: patch_manager_backup_status == 1 and patch_manager_backup_age_seconds > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Backup PostgreSQL antigo
          description: O último backup concluído do Patch Manager tem mais de 24 horas.

      - alert: PatchManagerGreenboneSyncFailed
        expr: patch_manager_greenbone_enabled == 1 and patch_manager_greenbone_sync_ok == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Integração Greenbone sem sync saudável
          description: O Greenbone está habilitado, mas o estado mais recente de sincronização não está OK.

      - alert: PatchManagerHighOfflineRatio
        expr: |
          (patch_manager_agents_offline / (patch_manager_agents_online + patch_manager_agents_offline)) > 0.10
          and (patch_manager_agents_online + patch_manager_agents_offline) >= 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Muitos endpoints estão offline
          description: Mais de 10% dos endpoints gerenciados estão fora da janela de heartbeat.

      - alert: PatchManagerHTTP5xx
        expr: sum(rate(patch_manager_http_requests_total{status=~"5.."}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Taxa persistente de erros HTTP 5xx
          description: O Patch Manager está retornando erros 5xx de forma persistente.


      - alert: PatchManagerCriticalHealthChecksFailing
        expr: (patch_manager_health_services_unhealthy + patch_manager_health_applications_unhealthy) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Health checks críticos falhando
          description: Há serviço crítico ou health check de aplicação reportado como não saudável por endpoints gerenciados.

      - alert: PatchManagerHealthTelemetryErrors
        expr: patch_manager_health_collection_errors > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Erros persistentes na coleta de telemetria
          description: Um ou mais agentes não conseguem coletar alguma métrica de saúde esperada.


      - alert: PatchManagerRemediationEvidenceErrors
        expr: patch_manager_remediation_evidence{status="error"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Evidência de remediação com erro
          description: Há pelo menos um ciclo de remediação que não conseguiu iniciar ou concluir o rescan Greenbone.

      - alert: PatchManagerRemediationStillDetected
        expr: patch_manager_remediation_evidence{status="still_detected"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Vulnerabilidade ainda detectada após patch
          description: Um rescan pós-patch confirmou que a vulnerabilidade continua presente.


      - alert: PatchManagerCompatibilityBlockedJobs
        expr: patch_manager_agent_compatibility_enforced == 1 and patch_manager_jobs{status="blocked"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Jobs bloqueados por compatibilidade
          description: Há jobs aguardando atualização de versão, protocolo ou capabilities do agente.

      - alert: PatchManagerIncompatibleAgents
        expr: patch_manager_agent_compatibility_enforced == 1 and sum(patch_manager_agent_compatibility{status!="supported"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Agentes incompatíveis na frota
          description: Um ou mais endpoints não atendem a versão/protocolo mínimo exigido pelo Patch Manager.


      - alert: PatchManagerAgentUpdateStagingErrors
        expr: patch_manager_agent_update_distribution_enabled == 1 and patch_manager_agent_update_state{status="error"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Falha no staging de update do agente
          description: Um ou mais agentes não conseguiram verificar ou preparar a release assinada.


      - alert: PatchManagerAgentActivationRollback
        expr: patch_manager_agent_activation_state{status="rolled_back"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Update do agente sofreu rollback automático
          description: O watchdog reverteu pelo menos um endpoint para a versão anterior do agente.

      - alert: PatchManagerAgentActivationPendingTooLong
        expr: sum(patch_manager_agent_activation_state{status=~"pending|switching"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Ativação do agente não foi confirmada
          description: Há endpoint aguardando confirmação de heartbeat após troca da release do agente.
