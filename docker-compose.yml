services:
  db:
    image: postgres:17-alpine
    container_name: patch-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patchmgr}
      POSTGRES_USER: ${POSTGRES_USER:-patchmgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env}
    volumes:
      - patch_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patchmgr} -d ${POSTGRES_DB:-patchmgr}"]
      interval: 10s
      timeout: 5s
      retries: 10

  patch-manager:
    build: ./server
    container_name: patch-manager
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-patchmgr}
      DB_USER: ${POSTGRES_USER:-patchmgr}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env}
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:?configure ENROLLMENT_TOKEN in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      BREAK_GLASS_ADMIN_TOKEN: ${BREAK_GLASS_ADMIN_TOKEN:-}
      AGENT_MTLS_REQUIRED: ${AGENT_MTLS_REQUIRED:-false}
      AGENT_ONLINE_SECONDS: ${AGENT_ONLINE_SECONDS:-300}
      AGENT_MIN_VERSION: ${AGENT_MIN_VERSION:-0.13.0}
      AGENT_MIN_PROTOCOL: ${AGENT_MIN_PROTOCOL:-2}
      AGENT_ENFORCE_COMPATIBILITY: ${AGENT_ENFORCE_COMPATIBILITY:-false}
      BACKUP_STATUS_FILE: /runtime/backup-status.json
      JOB_CLAIM_LEASE_SECONDS: ${JOB_CLAIM_LEASE_SECONDS:-300}
      JOB_RUNNING_LEASE_SECONDS: ${JOB_RUNNING_LEASE_SECONDS:-7200}
      GREENBONE_ENABLED: ${GREENBONE_ENABLED:-false}
      GREENBONE_TRANSPORT: ${GREENBONE_TRANSPORT:-tls}
      GREENBONE_HOST: ${GREENBONE_HOST:-127.0.0.1}
      GREENBONE_PORT: ${GREENBONE_PORT:-9390}
      GREENBONE_SOCKET: ${GREENBONE_SOCKET:-/run/gvmd/gvmd.sock}
      GREENBONE_USERNAME: ${GREENBONE_USERNAME:-}
      GREENBONE_PASSWORD: ${GREENBONE_PASSWORD:-}
      GREENBONE_CA_FILE: ${GREENBONE_CA_FILE:-}
      GREENBONE_CERT_FILE: ${GREENBONE_CERT_FILE:-}
      GREENBONE_KEY_FILE: ${GREENBONE_KEY_FILE:-}
      GREENBONE_KEY_PASSWORD: ${GREENBONE_KEY_PASSWORD:-}
      GREENBONE_TIMEOUT: ${GREENBONE_TIMEOUT:-60}
      GREENBONE_SYNC_INTERVAL: ${GREENBONE_SYNC_INTERVAL:-900}
      GREENBONE_RESULT_FILTER: ${GREENBONE_RESULT_FILTER:-rows=-1 min_qod=70}
      GREENBONE_TASK_FILTER: ${GREENBONE_TASK_FILTER:-rows=-1}
      GREENBONE_REPORT_ID: ${GREENBONE_REPORT_ID:-}
      GREENBONE_RECONCILE_ABSENT: ${GREENBONE_RECONCILE_ABSENT:-false}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./runtime:/runtime:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  patch_db_data:
