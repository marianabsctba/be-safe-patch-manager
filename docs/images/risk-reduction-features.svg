<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>.bg{fill:#09090b}.panel{fill:#15151a;stroke:#2b2b33;stroke-width:2}.txt{fill:#f5f5f7;font-family:Arial}.muted{fill:#9c9ca8;font-family:Arial}.pink{fill:#ff2d84}.green{fill:#55d47b}.yellow{fill:#ffcc4d}.h1{font-size:40px;font-weight:800}.h2{font-size:24px;font-weight:700}.body{font-size:17px}.small{font-size:13px}.line{stroke:#555561;stroke-width:3;fill:none}</style>
<rect width="1600" height="900" class="bg"/><text x="70" y="80" class="txt h1">Risk-Based Remediation</text><text x="70" y="118" class="muted body">finding → asset context → remediation decision → governed patch rollout → evidence</text>
<rect x="70" y="180" width="300" height="180" rx="20" class="panel"/><text x="100" y="220" class="pink h2">Finding Risk</text><text x="100" y="265" class="txt body">CVSS · EPSS · KEV</text><text x="100" y="300" class="muted small">ransomware · SLA · idade</text>
<rect x="460" y="180" width="300" height="180" rx="20" class="panel"/><text x="490" y="220" class="pink h2">Asset Context</text><text x="490" y="265" class="txt body">criticidade · external</text><text x="490" y="300" class="muted small">owner · service · environment</text>
<rect x="850" y="180" width="300" height="180" rx="20" class="panel"/><text x="880" y="220" class="pink h2">Decision Engine</text><text x="880" y="265" class="txt body">P0–P3 · change risk</text><text x="880" y="300" class="muted small">rollout · approval · rollback</text>
<rect x="1240" y="180" width="290" height="180" rx="20" class="panel"/><text x="1270" y="220" class="pink h2">Evidence</text><text x="1270" y="265" class="txt body">job · rescan · proof</text><text x="1270" y="300" class="muted small">risk history · audit</text>
<path d="M370 270 H450 M760 270 H840 M1150 270 H1230" class="line"/>
<rect x="140" y="480" width="380" height="230" rx="20" class="panel"/><text x="170" y="525" class="pink h2">Remediation Hub</text><text x="170" y="570" class="txt body">patch groups · CVEs · assets</text><text x="170" y="605" class="muted small">projected risk reduction · confidence</text><text x="170" y="650" class="green body">prepare governed campaign draft</text>
<rect x="610" y="480" width="380" height="230" rx="20" class="panel"/><text x="640" y="525" class="pink h2">Auto Patch Policy</text><text x="640" y="570" class="txt body">KEV · external · Patch Tuesday</text><text x="640" y="605" class="muted small">simulation · scope funnel · ledger</text><text x="640" y="650" class="yellow body">recommend / draft only</text>
<rect x="1080" y="480" width="380" height="230" rx="20" class="panel"/><text x="1110" y="525" class="pink h2">Safe Promotion</text><text x="1110" y="570" class="txt body">health · soak · regression</text><text x="1110" y="605" class="muted small">STABLE / REGRESSION / NO_BASELINE</text><text x="1110" y="650" class="green body">PROMOTE / PAUSE / WAIT</text>
<text x="800" y="805" text-anchor="middle" class="muted body">Sem score composto oculto · decisões explicáveis · nenhuma promoção silenciosa</text>
</svg>