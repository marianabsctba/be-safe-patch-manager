<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>.bg{fill:#09090b}.panel{fill:#15151a;stroke:#2b2b33;stroke-width:2}.txt{fill:#f5f5f7;font-family:Arial}.muted{fill:#9c9ca8;font-family:Arial}.pink{fill:#ff2d84}.green{fill:#55d47b}.yellow{fill:#ffcc4d}.red{fill:#ff646f}.h1{font-size:40px;font-weight:800}.h2{font-size:25px;font-weight:700}.body{font-size:18px}.small{font-size:14px}.line{stroke:#555561;stroke-width:3;fill:none}</style>
<rect width="1600" height="900" class="bg"/><text x="70" y="80" class="txt h1">Progressive Rollout Governance</text><text x="70" y="118" class="muted body">plan → health gate → soak → regression intelligence → safe promotion</text>
<rect x="80" y="170" width="1440" height="180" rx="22" class="panel"/>
<text x="110" y="212" class="pink small">CAMPAIGN</text><text x="110" y="250" class="txt h2">September Critical Updates</text>
<text x="110" y="292" class="muted small">Rollout plan</text><text x="260" y="292" class="txt body">10 → 30 → 100%</text>
<text x="520" y="292" class="muted small">Soak</text><text x="590" y="292" class="txt body">60 min</text>
<text x="750" y="292" class="muted small">Min success</text><text x="865" y="292" class="txt body">90%</text>
<text x="1030" y="292" class="muted small">Max drop</text><text x="1130" y="292" class="txt body">5 p.p.</text>
<text x="1290" y="292" class="muted small">State</text><text x="1350" y="292" class="green body">PROMOTE</text>
<rect x="100" y="430" width="230" height="150" rx="20" class="panel"/><text x="125" y="470" class="pink h2">Ring 10%</text><text x="125" y="510" class="txt small">98% success</text><text x="125" y="540" class="muted small">baseline</text>
<rect x="390" y="430" width="230" height="150" rx="20" class="panel"/><text x="415" y="470" class="txt h2">Health Gate</text><text x="415" y="510" class="green small">PASS</text><text x="415" y="540" class="muted small">validation + telemetry</text>
<rect x="680" y="430" width="230" height="150" rx="20" class="panel"/><text x="705" y="470" class="txt h2">Soak</text><text x="705" y="510" class="green small">elapsed</text><text x="705" y="540" class="muted small">60 min</text>
<rect x="970" y="430" width="230" height="150" rx="20" class="panel"/><text x="995" y="470" class="txt h2">Regression</text><text x="995" y="510" class="green small">STABLE</text><text x="995" y="540" class="muted small">drop 1.6 p.p.</text>
<rect x="1260" y="430" width="230" height="150" rx="20" class="panel"/><text x="1285" y="470" class="txt h2">Safe Promotion</text><text x="1285" y="510" class="green small">PROMOTE</text><text x="1285" y="540" class="muted small">next ring 30%</text>
<path d="M330 505 H380 M620 505 H670 M910 505 H960 M1200 505 H1250" class="line"/>
<rect x="100" y="650" width="1390" height="150" rx="20" class="panel"/><text x="125" y="694" class="pink h2">Se regressão for detectada</text><text x="125" y="735" class="txt body">success 98% → 88% · queda 10 p.p. · limite 5 p.p.</text><text x="980" y="735" class="red h2">REGRESSION → PAUSE</text><text x="125" y="772" class="muted small">A recomendação é explicável; promoção real continua auditada e governada.</text>
</svg>