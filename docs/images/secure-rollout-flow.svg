<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

<style>
  .bg{fill:#0b0b0f}.panel{fill:#14141a;stroke:#2a2a35;stroke-width:2}.panel2{fill:#101016;stroke:#252530;stroke-width:2}
  .pink{fill:#ff2d84}.pinkStroke{stroke:#ff2d84}.txt{fill:#f5f5f7;font-family:Inter,Arial,sans-serif}
  .muted{fill:#9a9aa8;font-family:Inter,Arial,sans-serif}.green{fill:#53d769}.yellow{fill:#ffcc4d}.red{fill:#ff5b66}
  .cyan{fill:#56d4dd}.line{stroke:#5b5b6c;stroke-width:3;fill:none}.thin{stroke:#353542;stroke-width:2;fill:none}
  .h1{font-size:42px;font-weight:800}.h2{font-size:26px;font-weight:700}.h3{font-size:20px;font-weight:700}
  .body{font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
</style><rect class="bg" width="1600" height="900"/>
<text x="64" y="80" class="txt h1">Fluxo seguro de implantação</text><text x="64" y="118" class="muted body">campanha → rings → health gate → evidência</text>
<rect x="120" y="240" width="230" height="150" rx="22" class="panel"/><circle cx="158" cy="278" r="22" class="pink"/><text x="151" y="286" class="txt h3">1</text><text x="144" y="326" class="txt h3">Draft</text><text x="144" y="358" class="muted tiny">alvo · packages · janela</text><rect x="380" y="240" width="230" height="150" rx="22" class="panel"/><circle cx="418" cy="278" r="22" class="pink"/><text x="411" y="286" class="txt h3">2</text><text x="404" y="326" class="txt h3">Checkpoint</text><text x="404" y="358" class="muted tiny">rollback quando suportado</text><rect x="660" y="240" width="230" height="150" rx="22" class="panel"/><circle cx="698" cy="278" r="22" class="pink"/><text x="691" y="286" class="txt h3">3</text><text x="684" y="326" class="txt h3">Ring 10%</text><text x="684" y="358" class="muted tiny">distribuição inicial</text><rect x="940" y="240" width="230" height="150" rx="22" class="panel"/><circle cx="978" cy="278" r="22" class="pink"/><text x="971" y="286" class="txt h3">4</text><text x="964" y="326" class="txt h3">Health Gate</text><text x="964" y="358" class="muted tiny">CPU · memória · serviços</text><rect x="1220" y="240" width="230" height="150" rx="22" class="panel"/><circle cx="1258" cy="278" r="22" class="pink"/><text x="1251" y="286" class="txt h3">5</text><text x="1244" y="326" class="txt h3">Ring 30%</text><text x="1244" y="358" class="muted tiny">promoção controlada</text><rect x="940" y="520" width="230" height="150" rx="22" class="panel"/><circle cx="978" cy="558" r="22" class="pink"/><text x="971" y="566" class="txt h3">6</text><text x="964" y="606" class="txt h3">Health Gate</text><text x="964" y="638" class="muted tiny">sem override em update agente</text><rect x="660" y="520" width="230" height="150" rx="22" class="panel"/><circle cx="698" cy="558" r="22" class="pink"/><text x="691" y="566" class="txt h3">7</text><text x="684" y="606" class="txt h3">Ring 100%</text><text x="684" y="638" class="muted tiny">100% de sucesso</text><rect x="380" y="520" width="230" height="150" rx="22" class="panel"/><circle cx="418" cy="558" r="22" class="pink"/><text x="411" y="566" class="txt h3">8</text><text x="404" y="606" class="txt h3">Rescan / Evidência</text><text x="404" y="638" class="muted tiny">Greenbone + prova pós-patch</text><rect x="120" y="520" width="230" height="150" rx="22" class="panel"/><circle cx="158" cy="558" r="22" class="pink"/><text x="151" y="566" class="txt h3">9</text><text x="144" y="606" class="txt h3">Encerrar</text><text x="144" y="638" class="muted tiny">finding só muda com evidência</text>
<path d="M350 315 H370 M610 315 H650 M890 315 H930 M1170 315 H1210" class="line"/>
<path d="M1335 390 V470 H1170" class="line"/><path d="M940 595 H900 M660 595 H610 M380 595 H350" class="line"/>
<rect x="1240" y="520" width="290" height="150" rx="22" style="fill:#2a1018;stroke:#ff5b66;stroke-width:2"/>
<text x="1266" y="562" class="red h3">Falha de health gate?</text><text x="1266" y="598" class="txt small">bloqueia promoção</text><text x="1266" y="628" class="muted small">rollback só com aprovação manual</text>
<text x="800" y="792" class="pink h2" text-anchor="middle">nenhum ring promove sozinho</text>
